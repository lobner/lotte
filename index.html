<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lotte Løbner</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #fef7fb, #eef7ff);
        color: #1f2937;
      }

      main {
        width: min(760px, 92vw);
        padding: 2.5rem;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 14px 40px rgba(15, 23, 42, 0.12);
      }

      h1 {
        margin-top: 0;
      }

      ul {
        margin: 0;
        padding-left: 1.25rem;
      }

      li + li {
        margin-top: 0.65rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lotte Løbner</h1>
      <p>En præsentations-side om Lotte.</p>
      <ul>
        <li>Født i Vorbasse.</li>
        <li>Matematik-økonom fra Aarhus, 2006-2012.</li>
        <li>Mor til to piger: Ella og Nora.</li>
        <li>Har netop gennemført Nordic Race i Aarhus.</li>
        <li>Gift med Søren Løbner.</li>
      </ul>
    </main>
  </body>
</html>
